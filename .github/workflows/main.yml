name: run-tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: ['8.4']
                laravel: ['12.*']
                stability: [prefer-stable]
                include:
                    - laravel: '12.*'
                      testbench: '^10.0'

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction

            - name: Static analysis
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Execute tests
              run: vendor/bin/pest

            # Pint ainda não roda aqui: o repositório inteiro (155 arquivos, quase
            # todos por line_ending) reprova o preset, e ligar a checagem antes da
            # normalização deixaria o CI vermelho em todo commit. Depois de rodar
            # `composer lint` uma vez, em commit isolado, descomente:
            #
            # - name: Code style
            #   run: vendor/bin/pint --test
