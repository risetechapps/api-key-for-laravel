                    data: { $ref: '#/components/schemas/SubscriptionCancelledData' }
      responses:
        '2XX': { $ref: '#/components/responses/WebhookAccepted' }
        default: { $ref: '#/components/responses/WebhookRetried' }
  subscription.expired:
    post:
      operationId: webhook_subscription_expired
      summary: subscription.expired
      description: "The subscription ended and the account's keys were deactivated."
