components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: |
        The key shown once when it is created in the dashboard. The header name
        is configurable (`api-key.header_name`); `X-API-KEY` is the default.

  parameters:
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: |
        `sha256=` followed by the hex HMAC-SHA256 of `<X-Webhook-Timestamp>.<raw body>`,
        keyed with the endpoint's secret (`whsec_…`, used whole). Recompute it over
        the raw bytes received, never over re-encoded JSON, and compare in
        constant time.
      schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      example: sha256=5f2b8a0c1e4d7f9a3b6c8e0d2f4a6b8c0e2d4f6a8b0c2e4d6f8a0b2c4e6d8f0a
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Unix time (seconds) of this attempt. Part of the signed content; reject deliveries more than 5 minutes off to stop replays.
      schema: { type: string, pattern: '^[0-9]+$' }
      example: '1793276848'
    WebhookId:
      name: X-Webhook-Id
      in: header
      required: true
      description: Event id, the same as `id` in the body. Identical on every retry and on a manual redelivery from the dashboard; use it to process each event once.
      schema: { type: string }
      example: evt_01jbx8m2k7c9v4t6q3n5p0r8s2
    WebhookEvent:
      name: X-Webhook-Event
      in: header
      required: true
      description: Event name, the same as `event` in the body.
      schema: { type: string }
      example: subscription.activated

  headers:
    X-Quota-Limit:
      description: Requests included in the current period. Absent on plans without a limit.
      schema: { type: integer, minimum: 1 }
    X-Quota-Remaining:
      description: Requests left in the current period, already counting this one. `0` while in overage. Absent on plans without a limit.
      schema: { type: integer, minimum: 0 }
    X-Quota-Used:
      description: Requests counted in the current period, this one included. Goes above the limit while in overage.
      schema: { type: integer, minimum: 0 }
    X-Quota-Reset:
      description: End of the current period as a Unix timestamp (seconds). The counter goes back to zero when the plan renews.
      schema: { type: integer }
    X-RateLimit-Limit:
      description: Requests allowed per minute for this key. Absent when no per-minute limit applies.
      schema: { type: integer, minimum: 1 }
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema: { type: integer, minimum: 0 }
    Retry-After:
      description: Seconds to wait before retrying. Sent with `RATE_LIMITED`.
      schema: { type: integer, minimum: 0 }
    X-Plan-Status:
      description: Present only while the plan is in its grace period.
      schema: { type: string, enum: [grace-period] }
    X-Grace-Period-Days-Remaining:
      description: Days left in the grace period. Sent with `X-Plan-Status`.
      schema: { type: integer, minimum: 0 }

  schemas:
    ApiErrorCode:
      type: string
      description: |
        | Code | HTTP | When |
        |---|---|---|
        | `MISSING_API_KEY` | 401 | The key header is missing |
        | `INVALID_API_KEY` | 401 | Unknown, inactive, expired or ownerless key |
        | `UNAUTHENTICATED` | 401 | No authenticated user reached the plan check |
        | `FEATURE_NOT_IN_PLAN` | 402 | The plan has none of the route's features |
        | `ACCOUNT_DISABLED` | 403 | The account is suspended |
        | `PLAN_INACTIVE` | 403 | No active plan |
        | `PLAN_EXPIRED` | 403 | Plan expired and grace period over |
        | `ORIGIN_NOT_ALLOWED` | 403 | Origin or IP not in the key's allowed list |
        | `API_KEY_SCOPE_DENIED` | 403 | The key may not call the route's feature |
        | `RATE_LIMITED` | 429 | Over the per-minute limit |
        | `REQUEST_LIMIT_REACHED` | 429 | Period quota exhausted |
      enum:
        - MISSING_API_KEY
        - INVALID_API_KEY
        - ACCOUNT_DISABLED
        - UNAUTHENTICATED
        - RATE_LIMITED
        - PLAN_INACTIVE
        - PLAN_EXPIRED
        - REQUEST_LIMIT_REACHED
        - ORIGIN_NOT_ALLOWED
        - API_KEY_SCOPE_DENIED
        - FEATURE_NOT_IN_PLAN

    ApiError:
      type: object
      required: [success, message, error_code]
      properties:
        success:
          const: false
        message:
          type: string
          description: Human-readable, in English. May change; do not parse it.
        error_code:
          $ref: '#/components/schemas/ApiErrorCode'
        features:
          type: array
          items: { type: string }
          description: Features the route requires. Sent with `FEATURE_NOT_IN_PLAN` and `API_KEY_SCOPE_DENIED`.
        retry_after:
          type: integer
          description: Seconds to wait. Sent with `RATE_LIMITED`.

    Usage:
      type: object
      required: [plan, period, requests, overage, rate_limit, api_key]
      properties:
        plan:
          type: object
          required: [id, name, billing_cycle]
          properties:
            id: { type: [string, 'null'], format: uuid }
            name: { type: [string, 'null'] }
            billing_cycle:
              type: [string, 'null']
              enum: [weekly, monthly, annually, null]
        period:
          type: object
          required: [start, end, status, grace_period_ends_at, trial, cancelled]
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
            status:
              type: string
              enum: [active, grace_period]
            grace_period_ends_at:
              type: [string, 'null']
              format: date-time
              description: Set only while `status` is `grace_period`.
            trial: { type: boolean }
            cancelled:
              type: boolean
              description: Renewal was called off. The paid period keeps working until `end`.
        requests:
          type: object
          required: [limit, used, remaining, resets_at]
          properties:
            limit:
              type: [integer, 'null']
              description: '`null` = no limit.'
            used: { type: integer, minimum: 0 }
            remaining:
              type: [integer, 'null']
              minimum: 0
              description: '`null` = no limit. `0` while in overage.'
            resets_at: { type: [string, 'null'], format: date-time }
        overage:
          type: object
          description: Requests beyond the limit, billed at the end of the period.
          required: [available, enabled, requests, max_requests, price_per_request, amount]
          properties:
            available:
              type: boolean
              description: The plan offers overage.
            enabled:
              type: boolean
              description: The account owner turned overage on.
            requests:
              type: integer
              minimum: 0
              description: Requests beyond the limit so far.
            max_requests:
              type: [integer, 'null']
              minimum: 0
              description: Requests allowed beyond the limit. `0` = none, `null` = no cap.
            price_per_request: { type: [number, 'null'] }
            amount:
              type: number
              description: Amount accrued so far, in the account's currency.
        rate_limit:
          type: object
          required: [per_minute]
          properties:
            per_minute:
              type: [integer, 'null']
              description: '`null` = no per-minute limit.'
        api_key:
          type: [object, 'null']
          description: The key used for this call. The secret is never returned.
          required: [id, name, expires_at]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            expires_at: { type: [string, 'null'], format: date-time }

    DailyUsage:
      type: object
      required: [from, to, timezone, days]
      properties:
        from: { type: string, format: date, description: 'First day of the window.' }
        to: { type: string, format: date, description: 'Last day of the window (today).' }
        timezone: { type: string, description: 'Time zone the dates are in.' }
        days:
          type: array
          items:
            type: object
            required: [date, total, success, client_error, server_error]
            properties:
              date: { type: string, format: date }
              total: { type: integer, minimum: 0, description: 'Every recorded request.' }
              success: { type: integer, minimum: 0, description: '2xx and 3xx.' }
              client_error: { type: integer, minimum: 0, description: '4xx, refusals included.' }
              server_error: { type: integer, minimum: 0, description: '5xx.' }

    WebhookEnvelope:
      type: object
      required: [id, event, created_at, data]
      properties:
        id: { type: string, description: 'Event id (`evt_` + ULID). Same as `X-Webhook-Id`.', example: evt_01jbx8m2k7c9v4t6q3n5p0r8s2 }
        event: { type: string, description: Event name. Same as `X-Webhook-Event`. }
        created_at: { type: string, format: date-time, description: When the event happened. Retries keep it; only the timestamp header changes. }
        data: { type: object, description: Event-specific payload. }
    SubscriptionData:
      type: object
      required: [subscription_id, plan, start_date, end_date, trial]
      properties:
        subscription_id: { type: string, format: uuid }
        plan: { type: string, description: Plan name. }
        start_date: { type: [string, 'null'], format: date-time }
        end_date: { type: [string, 'null'], format: date-time }
        trial: { type: boolean }
    SubscriptionChangedData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [previous_plan]
          properties:
            previous_plan: { type: [string, 'null'], description: 'Null on `subscription.activated`.' }
    SubscriptionCancelledData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [access_until]
          properties:
            access_until: { type: string, format: date-time }
    SubscriptionGracePeriodData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [grace_period_ends_at]
          properties:
            grace_period_ends_at: { type: string, format: date-time }
    SubscriptionRefundedData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [amount]
          properties:
            amount: { type: number, description: Refunded amount. }
    RenewalFailedData:
      type: object
      required: [plan, amount, attempt, next_attempt_at]
      properties:
        plan: { type: string }
        amount: { type: number }
        attempt: { type: integer, minimum: 1 }
        next_attempt_at: { type: [string, 'null'], format: date-time, description: Null after the last attempt. }
    PaymentRequiredData:
      type: object
      required: [subscription_id, plan, amount, reason, access_until]
      properties:
        subscription_id: { type: string, format: uuid }
        plan: { type: string }
        amount: { type: number }
        reason: { type: string, enum: [no_card, card_out_of_use, pix, cvv_required] }
        access_until: { type: [string, 'null'], format: date-time, description: End of the grace period. }
    PaymentRejectedData:
      type: object
      required: [plan, payment_id, amount, renewal]
      properties:
        plan: { type: string }
        payment_id: { type: string, description: Payment id at the gateway. }
        amount: { type: number }
        renewal: { type: boolean }
    OverageChargedData:
      type: object
      required: [plan, state, amount, requests]
      properties:
        plan: { type: [string, 'null'] }
        state: { type: string, enum: [paid, payment_required, rejected] }
        amount: { type: number }
        requests: { type: integer, description: Requests above the limit in the period. }
    UsageThresholdData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [requests_used, requests_limit, threshold_percent]
          properties:
            requests_used: { type: integer }
            requests_limit: { type: integer }
            threshold_percent: { type: integer }
    UsageLimitData:
      allOf:
        - $ref: '#/components/schemas/SubscriptionData'
        - type: object
          required: [requests_used, requests_limit]
          properties:
            requests_used: { type: integer }
            requests_limit: { type: integer }
    OverageStartedData:
      type: object
      required: [subscription_id, plan, requests_limit, price_per_request]
      properties:
        subscription_id: { type: string, format: uuid }
        plan: { type: string }
        requests_limit: { type: integer }
        price_per_request: { type: number }
    ApiKeyExpiringData:
      type: object
      required: [api_key_id, name, expires_at, days_left]
      description: Never carries the key itself.
      properties:
        api_key_id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer, minimum: 0 }
    WebhookTestData:
      type: object
      required: [message]
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            MISSING_API_KEY:
              value: { success: false, message: 'API key is missing. Send it in the X-API-KEY header.', error_code: MISSING_API_KEY }
            INVALID_API_KEY:
              value: { success: false, message: Invalid API key., error_code: INVALID_API_KEY }
            UNAUTHENTICATED:
              value: { success: false, message: Unauthenticated., error_code: UNAUTHENTICATED }

    PaymentRequired:
      description: The plan does not include the route's feature.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            FEATURE_NOT_IN_PLAN:
              value: { success: false, message: 'Your plan does not include any of these features: reports.', error_code: FEATURE_NOT_IN_PLAN, features: [reports] }

    Forbidden:
      description: Authenticated, but not allowed right now.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            ACCOUNT_DISABLED:
              value: { success: false, message: This account is suspended. Please contact support., error_code: ACCOUNT_DISABLED }
            PLAN_INACTIVE:
              value: { success: false, message: Your plan has expired or is not active., error_code: PLAN_INACTIVE }
            PLAN_EXPIRED:
              value: { success: false, message: Your plan has expired and the grace period has ended., error_code: PLAN_EXPIRED }
            ORIGIN_NOT_ALLOWED:
              value: { success: false, message: Request origin or IP is not allowed for this API key., error_code: ORIGIN_NOT_ALLOWED }
            API_KEY_SCOPE_DENIED:
              value: { success: false, message: This API key is not allowed to access this resource., error_code: API_KEY_SCOPE_DENIED, features: [reports] }

    TooManyRequests:
      description: Per-minute limit or period quota exhausted. Neither counts against the quota.
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
        X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
        X-Quota-Limit: { $ref: '#/components/headers/X-Quota-Limit' }
        X-Quota-Remaining: { $ref: '#/components/headers/X-Quota-Remaining' }
        X-Quota-Used: { $ref: '#/components/headers/X-Quota-Used' }
        X-Quota-Reset: { $ref: '#/components/headers/X-Quota-Reset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            RATE_LIMITED:
              value: { success: false, message: Too many requests per minute. Please wait and try again., error_code: RATE_LIMITED, retry_after: 42 }
            REQUEST_LIMIT_REACHED:
              value: { success: false, message: Request limit reached for the current billing period., error_code: REQUEST_LIMIT_REACHED }
    WebhookAccepted:
      description: Any 2xx marks the delivery as done. Answer within 10 seconds (`api-key.webhooks.timeout`); do the heavy work after answering.
    WebhookRetried:
      description: |
        Anything else (or no answer in time) is retried after 1 min, 5 min,
        15 min, 1 h and 6 h, with the same `X-Webhook-Id` and a new timestamp
        and signature. After `api-key.webhooks.disable_after_failures` (20)
        lost deliveries in a row the endpoint is switched off.
