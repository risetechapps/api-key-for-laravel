openapi: 3.1.0

info:
  title: API key for Laravel — client API
  version: 1.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    The surface the **API consumer** talks to: requests authenticated by an API
    key, protected by the `plan` middleware group (key, per-minute rate limit,
    active plan, period quota, origin) and optionally by `feature:<name>`.

    The dashboard routes used by the bundled SPA (`/dashboard/*`, login,
    checkout) are not part of this contract.

    ## Using it for your own routes

    Every route you put under `plan` behaves the same way: same headers, same
    refusals. Reference the components from your own spec:

    ```yaml
    paths:
      /reports:
        get:
          security: [{ ApiKeyAuth: [] }]
          responses:
            '200':
              description: OK
              headers:
                X-Quota-Remaining: { $ref: 'vendor/risetechapps/api-key-for-laravel/docs/openapi.yaml#/components/headers/X-Quota-Remaining' }
            '401': { $ref: 'vendor/risetechapps/api-key-for-laravel/docs/openapi.yaml#/components/responses/Unauthorized' }
            '403': { $ref: 'vendor/risetechapps/api-key-for-laravel/docs/openapi.yaml#/components/responses/Forbidden' }
            '429': { $ref: 'vendor/risetechapps/api-key-for-laravel/docs/openapi.yaml#/components/responses/TooManyRequests' }
    ```

    ## Errors

    Refusals are always in English, whatever the `Accept-Language`, and carry a
    stable `error_code`. Decide on the code, never on the message text.

    ## Webhooks

    The account owner registers HTTPS URLs in the dashboard and picks the
    events. Each delivery is a signed `POST`; see the `webhooks` section for
    the events, their payloads and how to verify the signature. Events added
    by the application that installs the package (`WebhookDispatcher::registerEvents()`)
    use the same envelope and signature, with a `data` defined by that
    application.

    ## Quota accounting

    | Outcome | Counts against the quota? |
    |---|---|
    | 2xx / 3xx | yes |
    | 4xx from your own request | yes |
    | 429 `REQUEST_LIMIT_REACHED` | no |
    | 5xx | no — the slot is given back |
    | Refused by origin, key scope or plan feature | no |

servers:
  - url: '{baseUrl}/api/v1'
    variables:
      baseUrl:
        default: https://api.example.com
        description: Your application's URL. The `/api/v1` prefix is the package default.

security:
  - ApiKeyAuth: []

paths:
  /usage:
    get:
      operationId: getUsage
      summary: Current period usage
      description: |
        Plan, period, quota and overage for the account that owns the key.

        Does **not** count against the quota and keeps answering after the quota
        is exhausted. It is subject to the per-minute rate limit like any other
        call.
      tags: [Usage]
      responses:
        '200':
          description: Usage of the current period.
          headers:
            X-Quota-Limit: { $ref: '#/components/headers/X-Quota-Limit' }
            X-Quota-Remaining: { $ref: '#/components/headers/X-Quota-Remaining' }
            X-Quota-Used: { $ref: '#/components/headers/X-Quota-Used' }
            X-Quota-Reset: { $ref: '#/components/headers/X-Quota-Reset' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-Plan-Status: { $ref: '#/components/headers/X-Plan-Status' }
            X-Grace-Period-Days-Remaining: { $ref: '#/components/headers/X-Grace-Period-Days-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/Usage'
              example:
                success: true
                data:
                  plan:
                    id: 9d1c1a52-3f0e-4a8e-9a8e-2f7c4b1d6e10
                    name: Pro
                    billing_cycle: monthly
                  period:
                    start: '2026-10-01T00:00:00+00:00'
                    end: '2026-10-31T00:00:00+00:00'
                    status: active
                    grace_period_ends_at: null
                    trial: false
                    cancelled: false
                  requests:
                    limit: 100000
                    used: 81234
                    remaining: 18766
                    resets_at: '2026-10-31T00:00:00+00:00'
                  overage:
                    available: true
                    enabled: false
                    requests: 0
                    max_requests: 0
                    price_per_request: 0.002
                    amount: 0
                  rate_limit:
                    per_minute: 120
                  api_key:
                    id: 4b0a7d0e-8f1e-4c1a-b7a3-0c2d9e5f6a71
                    name: Production
                    expires_at: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /usage/daily:
    get:
      operationId: getDailyUsage
      summary: Requests per day
      description: |
        Requests recorded per day over the last `days` days, today included,
        split by status class. Every day in the window is listed, empty ones
        with zeros. Dates are in the application's time zone (`timezone`).

        This counts what was **recorded**, which includes calls that did not
        count against the quota (429 for an exhausted quota, 5xx). Summed over
        the period it is therefore not `requests.used` from `/usage`.

        Does not count against the quota.
      tags: [Usage]
      parameters:
        - name: days
          in: query
          required: false
          description: Window size. Values outside 1–90 are clamped into that range.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Daily request counts.
          headers:
            X-Quota-Limit: { $ref: '#/components/headers/X-Quota-Limit' }
            X-Quota-Remaining: { $ref: '#/components/headers/X-Quota-Remaining' }
            X-Quota-Used: { $ref: '#/components/headers/X-Quota-Used' }
            X-Quota-Reset: { $ref: '#/components/headers/X-Quota-Reset' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/DailyUsage'
              example:
                success: true
                data:
                  from: '2026-10-26'
                  to: '2026-10-28'
                  timezone: America/Sao_Paulo
                  days:
                    - { date: '2026-10-26', total: 1520, success: 1490, client_error: 28, server_error: 2 }
                    - { date: '2026-10-27', total: 0, success: 0, client_error: 0, server_error: 0 }
                    - { date: '2026-10-28', total: 311, success: 305, client_error: 6, server_error: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

tags:
  - name: Usage
    description: Quota and plan of the account that owns the API key.

webhooks:
  subscription.activated:
    post:
      operationId: webhook_subscription_activated
      summary: subscription.activated
      description: "A subscription started (first plan, or a new plan after none)."
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookEvent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { const: subscription.activated }
                    data: { $ref: '#/components/schemas/SubscriptionChangedData' }
      responses:
        '2XX': { $ref: '#/components/responses/WebhookAccepted' }
        default: { $ref: '#/components/responses/WebhookRetried' }
  subscription.changed:
    post:
      operationId: webhook_subscription_changed
      summary: subscription.changed
